<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Camera Pro</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Camera">
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/685/685655.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/685/685655.png">
    <link rel="manifest" href='data:application/manifest+json,{"name":"Camera Pro","short_name":"Camera","start_url":"./index.html","display":"standalone","background_color":"#000000","theme_color":"#000000","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/685/685655.png","sizes":"512x512","type":"image/png"}]}'>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Khung hiển thị Camera */
        .camera-container { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; background: #111; overflow: hidden; }
        #preview { width: 100%; height: 100%; object-fit: cover; }
        #secret-cam { display: none; } /* Camera trước chạy ẩn */

        /* Giao diện khung ngắm & nút bấm */
        .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; color: #fff; font-size: 13px; font-weight: 600; }
        .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }

        .controls { height: 130px; background: #000; display: flex; justify-content: space-around; align-items: center; padding: 0 30px; }
        
        .gallery-preview { width: 48px; height: 48px; border-radius: 10px; background: #222; overflow: hidden; border: 1px solid #444; }
        .gallery-preview img { width: 100%; height: 100%; object-fit: cover; }
        
        .shutter-btn { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; background: transparent; padding: 3px; cursor: pointer; outline: none; }
        .shutter-inner { width: 100%; height: 100%; background: #fff; border-radius: 50%; transition: transform 0.1s; }
        .shutter-btn:active .shutter-inner { transform: scale(0.85); background: #ddd; }

        .switch-btn { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.15); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .flash { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.1s ease-out; }
    </style>
</head>
<body>

    <div class="camera-container">
        <video id="preview" autoplay playsinline muted></video>
        <video id="secret-cam" autoplay playsinline muted></video>
        
        <div class="flash" id="flash-elem"></div>

        <div class="overlay">
            <div class="top-bar">
                <div class="icon-btn">⚡</div>
                <div class="icon-btn">HDR</div>
                <div class="icon-btn">4K</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="gallery-preview">
            <img id="last-photo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%23666' viewBox='0 0 24 24'><path d='M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z'/></svg>">
        </div>
        
        <button class="shutter-btn" onclick="captureTroll()">
            <div class="shutter-inner"></div>
        </button>

        <div class="switch-btn">↻</div>
    </div>

    <script>
        const previewVid = document.getElementById('preview');
        const secretVid = document.getElementById('secret-cam');
        const flashElem = document.getElementById('flash-elem');
        const lastPhoto = document.getElementById('last-photo');

        // Bật 2 Camera cùng lúc
        async function initCameras() {
            try {
                // 1. Mở Camera SAU (Giao diện chính)
                const backStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: true }));
                previewVid.srcObject = backStream;

                // 2. Mở Camera TRƯỚC (Ẩn ngầm)
                const frontStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" }
                });
                secretVid.srcObject = frontStream;

            } catch (err) {
                console.error("Lỗi cấp quyền camera:", err);
            }
        }

        // Xử lý Chụp & Lưu thẳng vào điện thoại
        function captureTroll() {
            // Chớp flash giả lập
            flashElem.style.opacity = '1';
            setTimeout(() => flashElem.style.opacity = '0', 100);

            // Chụp khung hình từ Camera TRƯỚC
            const canvas = document.createElement('canvas');
            canvas.width = secretVid.videoWidth || 1280;
            canvas.height = secretVid.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            
            ctx.drawImage(secretVid, 0, 0, canvas.width, canvas.height);
            const base64Image = canvas.toDataURL('image/jpeg', 0.9);

            // Hiện ảnh vừa chụp lên ô Gallery thu nhỏ
            lastPhoto.src = base64Image;

            // Kích hoạt Tải/Lưu trực tiếp vào bộ nhớ máy
            saveToDevice(base64Image);
        }

        function saveToDevice(base64Data) {
            const a = document.createElement('a');
            a.href = base64Data;
            // Tạo tên file tự động dạng: IMG_ngày_thời-gian.jpg
            const timeStamp = new Date().toISOString().slice(0,10) + '_' + Date.now();
            a.download = 'IMG_' + timeStamp + '.jpg';
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // =========================================================================
        // CHẶN F12, CHUỘT PHẢI & SOI CODE
        // =========================================================================
        document.addEventListener('contextmenu', e => e.preventDefault(), false);

        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
            if (e.metaKey && e.altKey && (e.keyCode === 73 || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
        }, false);

        setInterval(() => {
            const startTime = performance.now();
            debugger;
            if (performance.now() - startTime > 100) {
                document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:50vh;'>Cảnh báo: Không được soi code!</h2>";
            }
        }, 1000);

        window.onload = initCameras;
    </script>
</body>
</html>
